run_id: dhb_starvla_qwen_fresh_statehist4
run_root_dir: /home/andypark/Projects/repos/dhb-xr/_workspace/starvla_runs
seed: 42
trackers: [jsonl]
wandb_entity: offline
wandb_project: dhb_xr_corl2026
is_debug: false

framework:
  name: QwenDHB
  qwenvl:
    base_vlm: /home/andypark/Projects/repos/dhb-xr/vendor/starVLA/playground/Pretrained_models/Qwen2.5-VL-3B-Instruct
    attn_implementation: sdpa
    load_in_8bit: true
    device_map: auto
  action_model:
    action_model_type: DHB
    action_hidden_dim: 2048
    hidden_dim: 1024
    action_dim: 7
    state_dim: 8
    state_history_window: 4
    invariant_dim: 8
    num_oat_tokens: 8
    future_action_window_size: 7
    past_action_window_size: 0
    action_horizon: 8
    use_oat_quantizer: false
    lambda_oat_autoencode: 0.0
    lambda_invariant: 1.0
    # Live execution decodes DHB invariants. Keep a small raw-action loss as an
    # auxiliary grounding term so the shared temporal features stay tied to the
    # demonstrated EE displacement direction/scale. Keep the target shift off by
    # default: the shift=1 ablation reduced IK failures but regressed bowl reach.
    lambda_action: 0.1
    action_loss_target_shift: 0
    terminal_loss_weight: 1.0
    prefix_loss_steps: 4
    prefix_loss_weight: 2.0
    # Robust p95 absolute channel scales measured from 512 sampled LIBERO chunks.
    # This prevents small translational DHB magnitude channels from disappearing
    # inside raw MSE dominated by curvature/angular channels.
    invariant_loss_channel_scale: [0.0131, 0.6738, 0.9503, 1.5458, 0.0211, 0.3344, 0.5446, 1.5968]
    # Match temporal differences as well as values so constant invariant chunks
    # are penalized directly.
    lambda_invariant_delta: 2.0
    # Feed each learned timestep query directly to the prediction heads. The
    # Transformer decoder alone can collapse all chunk slots to the same feature
    # when training with frozen VLM context; this keeps timestep identity visible.
    head_query_residual_scale: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/andypark/Projects/data
    data_mix: libero_spatial_dhbxr
    include_state: true
    state_history_window: 4
    recompute_dhb_invariants_from_actions: true
    action_type: delta_qpos
    action_mode: abs  # Converter action columns already store EE deltas; do not delta them again.
    action_window_size: 8
    terminal_chunk_prob: 0.0
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 1
    num_workers: 0
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 1000
  num_warmup_steps: 100
  save_interval: 100
  eval_interval: 100
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: constant
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  pretrained_checkpoint: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
