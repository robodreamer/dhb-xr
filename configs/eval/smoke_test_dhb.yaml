# Smoke test — 1 task, 2 episodes, no docker (direct connection)
# Run: vla-eval run --config configs/eval/smoke_test_dhb.yaml --no-docker
server:
  url: "ws://localhost:8000"
output_dir: "./results/harness/smoke"
benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_spatial_smoke
    mode: sync
    episodes_per_task: 2
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
      send_state: true
      task_filter: ["pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate"]
