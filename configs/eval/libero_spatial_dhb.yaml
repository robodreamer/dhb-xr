# DHB-XR evaluation on LIBERO-Spatial benchmark
# Run: vla-eval run --config configs/eval/libero_spatial_dhb.yaml
server:
  url: "ws://localhost:8000"
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
output_dir: "./results/harness"
benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_spatial
    mode: sync
    episodes_per_task: 50
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
      send_state: true      # required: DHB needs EEF state for adaptation
