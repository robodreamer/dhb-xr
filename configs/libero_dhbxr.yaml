framework:
  name: "WM4A_DHB"
  backbone: "qwen2vl_2b"
  action_model:
    action_model_type: "DHB"
    action_hidden_dim: 2048
    hidden_dim: 1024
    action_dim: 7
    invariant_dim: 8
    num_oat_tokens: 8
    future_action_window_size: 7
    past_action_window_size: 0
    use_oat_quantizer: true
    lambda_invariant: 1.0
    lambda_action: 1.0

datasets:
  vla_data:
    data_root_dir: "/data/libero_lerobot"
    data_mix: "libero_spatial"
    per_device_batch_size: 16

trainer:
  max_train_steps: 50000
  save_interval: 5000
  logging_frequency: 100
  eval_interval: 1000
  learning_rate: 2e-5
  warmup_steps: 1000
