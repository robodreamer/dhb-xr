run_id: dhb_starvla
run_root_dir: /home/andypark/Projects/repos/dhb-xr/_workspace/starvla_runs
seed: 42
trackers: [jsonl, wandb]
wandb_entity: offline
wandb_project: dhb_xr_corl2026
is_debug: false

framework:
  name: WM4A_DHB
  world_model:
    base_wm: ./playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
    extract_layers: [-1]
  qwenvl:
    base_vlm: ./playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
  action_model:
    action_model_type: DHB
    action_hidden_dim: 2048
    hidden_dim: 1024
    action_dim: 7
    invariant_dim: 8
    num_oat_tokens: 8
    future_action_window_size: 7
    past_action_window_size: 0
    use_oat_quantizer: true
    lambda_invariant: 1.0
    lambda_action: 1.0
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/andypark/Projects/data
    data_mix: libero_spatial_dhbxr
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 2.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: constant
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
