[project]
name = "dhb_xr"
version = "0.3.0"
description = "DHB Extended Representations - SE(3) invariant trajectory encoding for robotics and VLA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy Park", email = "andypark.purdue@gmail.com" }]
keywords = [
    "robotics",
    "trajectory",
    "SE3",
    "invariants",
    "VLA",
    "imitation-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
optimization = ["casadi>=3.5", "spatial-casadi>=1.0"]
fatrop = ["casadi>=3.5", "rockit-meco>=0.1"]
gpu = ["torch>=2.0"]
cusadi = ["cusadi>=1.0", "torch>=2.0"]
tokenization = ["torch>=2.0", "einops>=0.6"]
database = ["faiss-cpu>=1.7", "dtaidistance>=3.0"]
examples = ["jupyter>=1.0", "ipykernel>=6.0", "notebook>=6.0"]
all = [
    "casadi>=3.5",
    "spatial-casadi>=1.0",
    "rockit-meco>=0.1",
    "torch>=2.0",
    "faiss-cpu>=1.7",
    "dtaidistance>=3.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "notebook>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
dhb_xr-examples = "dhb_xr.cli:examples_cmd"

[project.urls]
Homepage = "https://github.com/robodreamer/dhb-xr"
Documentation = "https://robodreamer.github.io/dhb-xr/"
Repository = "https://github.com/robodreamer/dhb-xr"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["dhb_xr*", "examples*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.10.*"
numpy = ">=1.20"
scipy = ">=1.7"
matplotlib = ">=3.5"
h5py = ">=3.15.1,<4"

[tool.pixi.pypi-dependencies]
build = ">=1.0.0"
twine = ">=4.0.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
ruff = ">=0.1.0"
mypy = ">=1.0"
pre-commit = ">=3.0"
cmake = ">=3.20"
ninja = "*"
mkdocs = ">=1.5"
mkdocs-material = ">=9.0"
mkdocstrings = ">=0.24"
mkdocstrings-python = ">=1.8"
mkdocs-material-extensions = ">=1.3"
pymdown-extensions = ">=10.0"
nanobind = ">=2.0"
jupyter = ">=1.0"
ipykernel = ">=6.0"
pytorch = ">=2.0"
casadi = ">=3.5"
pip = ">=23.0"

[tool.pixi.feature.gpu.dependencies]
# PyTorch CPU for basic GPU feature (use cuda feature for actual GPU)
pytorch = ">=2.0"

[tool.pixi.feature.cuda]
# CUDA feature needs pytorch channel first to get CUDA build
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "strict"

[tool.pixi.feature.cuda.target.linux-64.dependencies]
# CUDA-enabled PyTorch from pytorch channel (linux only)
pytorch = { version = ">=2.0", channel = "pytorch" }
pytorch-cuda = { version = ">=12.1", channel = "pytorch" }

[tool.pixi.feature.optimization.dependencies]
casadi = ">=3.5"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
gpu = { features = ["dev", "gpu"], solve-group = "gpu" }
cuda = { features = ["dev", "cuda", "optimization"], solve-group = "cuda" }
full = { features = ["dev", "gpu", "optimization"], solve-group = "full" }

[tool.pixi.tasks]
test = "pytest tests/ -v"
test-casadi = "pytest tests/test_casadi_solver.py tests/test_cusadi.py -v"
test-cov = "pytest tests/ -v --cov=src/dhb_xr --cov-report=html"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
typecheck = "mypy src/dhb_xr"
install = "pip install -e ."
build = "pip install -e ."
build-wheel = { cmd = "python -m build --wheel" }
build-sdist = { cmd = "python -m build --sdist" }
build-dist = { cmd = "python -m build" }
check-dist = "python -m twine check dist/*"
setup-pypirc = "bash scripts/setup_pypirc.sh"
upload-testpypi = "bash scripts/upload_testpypi.sh"
upload-pypi = "bash scripts/upload_pypi.sh"
publish-testpypi = "python -m build && bash scripts/upload_testpypi.sh"
publish-pypi = "python -m build && bash scripts/upload_pypi.sh"
version = "0.3.0"
benchmark = "python examples/benchmark_backends.py"
docs = "cp CHANGELOG.md docs/ && mkdocs build"
build-docs = "cp CHANGELOG.md docs/ && mkdocs build"
serve-docs = "mkdocs serve"
build-cpp = "cmake -B build -S . -DCMAKE_BUILD_TYPE=Release && cmake --build build && (cp build/src/dhb_xr/_cpp/_dhb_xr_cpp*.so src/dhb_xr/ 2>/dev/null || true)"
notebook = "pip install -e . && jupyter notebook notebooks/"
notebook-cuda = "pip install -e . && pip install -e /home/andypark/Projects/repos/cusadi && jupyter notebook notebooks/"
download-xdof = "python scripts/download_xdof_samples.py"
install-rockit = "python3 -m pip install rockit-meco"
clone-examples = "dhb_xr-examples --copy"
check-cuda = "python -c \"import torch; print(f'PyTorch {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}' if torch.cuda.is_available() else 'No CUDA')\""
